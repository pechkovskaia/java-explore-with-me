name: Debug startup

on:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Start
        run: docker compose up -d --build

      - name: Wait
        run: sleep 60

      - name: Status and logs
        if: always()
        run: |
          docker compose ps -a
          echo "===== EWM-SERVICE ====="
          docker compose logs --no-color ewm-service
          echo "===== STATS-SERVER ====="
          docker compose logs --no-color stats-server

      - name: Try port 8080
        if: always()
        run: curl -v http://localhost:8080/events || true