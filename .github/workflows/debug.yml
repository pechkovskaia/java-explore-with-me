name: Debug startup

on:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: 'yandex-praktikum/java-explore-with-me'
          ref: ${{ github.event.pull_request.head.ref }}
          path: tests

      - name: Check and Build application
        run: |
          cp -rf ./tests/checkstyle.xml ./checkstyle.xml
          cp -rf ./tests/suppressions.xml ./suppressions.xml
          mvn install -P check --no-transfer-progress
          docker compose build

      - name: Run Application
        run: |
          docker compose up --detach
          chmod a+x ./tests/.github/workflows/wait-for-it.sh
          ./tests/.github/workflows/wait-for-it.sh -t 60 localhost:8080
          ./tests/.github/workflows/wait-for-it.sh -t 60 localhost:9090

      - name: Diagnostics
        if: always()
        run: |
          docker compose ps -a
          echo "===== EWM-SERVICE ====="
          docker compose logs --no-color --timestamps ewm-service
          echo "===== STATS-SERVER (last 50) ====="
          docker compose logs --no-color stats-server | tail -n 50
          echo "===== LISTENING PORTS ====="
          sudo ss -ltnp | grep -E '8080|9090' || true
          echo "===== CURL ====="
          curl -sv --max-time 5 http://localhost:8080/events || true
          curl -sv --max-time 5 http://127.0.0.1:8080/events || true

      - name: Down
        if: always()
        run: docker compose down -v