name: Debug startup

on:
  pull_request:

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: 'yandex-praktikum/java-explore-with-me'
          ref: ${{ github.event.pull_request.head.ref }}
          path: tests

      - name: Which timeout
        run: |
          cat /etc/os-release | grep PRETTY_NAME
          readlink -f "$(command -v timeout)"
          timeout --version | head -1

      - name: Build
        run: |
          cp -rf ./tests/checkstyle.xml ./checkstyle.xml
          cp -rf ./tests/suppressions.xml ./suppressions.xml
          mvn install -P check --no-transfer-progress
          docker compose build

      - name: Run Application
        run: |
          docker compose up --detach
          chmod a+x ./tests/.github/workflows/wait-for-it.sh
          ./tests/.github/workflows/wait-for-it.sh -t 60 localhost:8080
          ./tests/.github/workflows/wait-for-it.sh -t 60 localhost:9090

      - name: Port check without wait-for-it
        if: always()
        run: |
          timeout 5 bash -c 'echo -n > /dev/tcp/localhost/8080' && echo TCP_OK || echo TCP_FAIL
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8080/events || true

      - name: Down
        if: always()
        run: docker compose down -v